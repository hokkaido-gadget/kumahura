name: Deploy website to Sakura

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakura-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Prepare only public website files
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import shutil

          root = Path.cwd()
          output = root / '.deploy'
          if output.exists():
              shutil.rmtree(output)
          output.mkdir()

          for name in ('index.html', 'styles.css', 'script.js', 'favicon.png'):
              source = root / name
              if not source.is_file():
                  raise SystemExit(f'Required public file is missing: {name}')
              shutil.copy2(source, output / name)

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('src', 'poster') and value and value.startswith('assets/'):
                          self.paths.add(value)

          parser = AssetParser()
          parser.feed((root / 'index.html').read_text(encoding='utf-8'))
          for relative in sorted(parser.paths):
              source = root / relative
              if not source.is_file():
                  raise SystemExit(f'Referenced public asset is missing: {relative}')
              target = output / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          print(f'Prepared {4 + len(parser.paths)} public files in .deploy/')
          PY

      - name: Check Sakura credentials
        id: credentials
        env:
          FTP_SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.SAKURA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.SAKURA_FTP_DIRECTORY }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_DIRECTORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the four SAKURA_FTP_* repository secrets to enable Sakura deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload website over encrypted FTPS
        if: steps.credentials.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USERNAME }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: .deploy/
          server-dir: ${{ secrets.SAKURA_FTP_DIRECTORY }}
          dangerous-clean-slate: false
